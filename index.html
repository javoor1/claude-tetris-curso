<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select"></select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <h1 class="game-title">TETRIS</h1>
        <p class="subtitle">Pulsa Enter o el botón para jugar</p>
        <button id="start-btn">Jugar</button>
        <div class="records">
          <span class="label">RECORDS</span>
          <div id="records-start"></div>
          <button id="reset-records-btn" class="link-btn">Resetear records</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-over" class="records hidden">
          <form id="name-form" class="hidden" autocomplete="off">
            <label for="name-input">¡Nuevo record! Tu nombre:</label>
            <input id="name-input" type="text" maxlength="12" />
            <button id="name-save-btn" type="submit">Guardar</button>
          </form>
          <div id="records-over-table"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume-btn" class="menu-btn">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <button id="pause-controls-btn" class="menu-btn" aria-expanded="false">Ver controles</button>
        <ul id="pause-controls-list" class="hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="level-select">
          Nivel inicial
          <select id="start-level">
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
            <option value="9">9</option><option value="10">10</option>
          </select>
        </label>
        <p class="menu-hint">Se aplica a la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="themes.js"></script>
  <script src="pause.js"></script>
  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
