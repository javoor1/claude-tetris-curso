name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Convención de ramas (ver GITHUB-FLOW.md y issue-formatter.yml).
          # El action crea por defecto `claude/issue-N-<timestamp>`; el prompt obliga a usar la rama acordada.
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE/PR: #${{ github.event.issue.number || github.event.pull_request.number }}

            Sigue las instrucciones del issue o comentario que te mencionó, con esta regla de ramas:

            1. Nombre de rama obligatorio: `tipo/numero-descripcion-corta`, con tipo en
               `feature`, `fix`, `docs`, `refactor` o `chore`. Nunca uses el prefijo `claude/`.
            2. Busca en los comentarios del issue el que empieza por `<!-- issue-formatter -->`
               (línea "Rama sugerida") y usa exactamente esa rama.
            3. Si ese comentario no existe, calcula el nombre tú: tipo según el issue
               (bug/error -> fix, mejora -> feature, documentación -> docs, etc.), el número del issue
               y 3-6 palabras del título en minúsculas, sin tildes, separadas por guiones.
            4. Si la rama en la que estás no coincide, crea la correcta desde `main`
               (`git switch -c <rama> origin/main`), haz ahí los commits y el push.
            5. Abre el PR desde esa rama e incluye `Closes #<numero>` en la descripción.
            Si el evento es un PR existente, trabaja en su rama actual y no crees otra.

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

